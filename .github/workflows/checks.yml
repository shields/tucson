name: Checks

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    name: Lint and coverage
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: "0.13.4"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.3"
          no-cache: true
      - run: make setup
      - run: make lint
      - run: make test-broker-deps
      - run: make test-broker
      - run: make test
      - run: make integration
      - run: make build
  zizmor:
    name: Workflow security
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          persona: pedantic
          advanced-security: false
          version: "1.31.1"
  image:
    name: Container (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      IMAGE_PLATFORM: linux/${{ matrix.arch }}
      REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: "0.13.4"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cache-binary: false
          driver-opts: image=moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c
      - run: uv sync --frozen
      - run: make test-broker-deps
      - run: make test-broker
      - run: make image
      - run: make test-image
      - run: make image-export
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.arch }}
          path: .build/images/${{ matrix.arch }}.tar
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          include-hidden-files: true
  publish:
    name: Publish tested images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks, zizmor, image]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write # Uploads images that passed every required check in this run.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compute version
        id: version
        env:
          REVISION: ${{ github.sha }}
        # No --dirty: a revision off main exits 2 instead of getting a -dev suffix.
        run: |
          version=$(./scripts/gitcalver.sh "$REVISION")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*
          path: .build/images
          merge-multiple: true
      - run: make release-tools
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote tested artifacts
        env:
          REVISION: ${{ github.sha }}
          RELEASE_TAG: ${{ steps.version.outputs.version }}
          RUN_SUFFIX: ${{ github.run_id }}-${{ github.run_attempt }}
          REPOSITORY: ${{ github.repository }}
        run:
          PATH="$PWD/.build/tools:$PATH"
          IMAGE_REPOSITORY="ghcr.io/${REPOSITORY,,}" make release
