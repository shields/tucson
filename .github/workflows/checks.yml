name: Checks

on:
  push:
    branches: ["**"]
    tags: ["v*.*.*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    name: Lint and coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.3"
          no-cache: true
      - run: make setup
      - run: make lint
      - run: make test-broker-deps
      - run: make test-broker
      - run: make test
      - run: make integration
      - run: make build
  zizmor:
    name: Workflow security
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          persona: pedantic
          advanced-security: false
          version: "1.30.1"
  image:
    name: Container (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      IMAGE_PLATFORM: linux/${{ matrix.arch }}
      REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cache-binary: false
          driver-opts: image=moby/buildkit:v0.34.0@sha256:b059f8d7226d0b326bc871af489a5dddf65e36af4d20d14251b072974d9ee87c
      - run: uv sync --frozen
      - run: make test-broker-deps
      - run: make test-broker
      - run: make image
      - run: make test-image
      - run: make image-export
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.arch }}
          path: .build/images/${{ matrix.arch }}.tar
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          include-hidden-files: true
  publish:
    name: Publish tested images
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [checks, zizmor, image]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write # Uploads images that passed every required check in this run.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*
          path: .build/images
          merge-multiple: true
      - run: make release-tools
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote tested artifacts
        env:
          REVISION: ${{ github.sha }}
          RELEASE_TAG: ${{ github.ref_name }}
          RUN_SUFFIX: ${{ github.run_id }}-${{ github.run_attempt }}
          REPOSITORY: ${{ github.repository }}
        run:
          PATH="$PWD/.build/tools:$PATH"
          IMAGE_REPOSITORY="ghcr.io/${REPOSITORY,,}" make release
